[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1sector"
version = "0.1.0"
description = "Sector-level lap time analysis for Formula 1 sessions, built on FastF1"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mayank P M" }]
dependencies = [
    "fastf1>=3.4",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "duckdb>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
f1sector = "f1sector.cli:main"
f1sector-warehouse = "f1sector.warehouse:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
f1sector = ["sql/*.sql", "sql/tests/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
